[advisories]
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2017-0008",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "NCSA",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "LicenseRef-sysl-1.0",
]
confidence-threshold = 0.8

[bans]
# These three belong to the `[bans]` table itself, not to the `[[bans.deny]]`
# entry below: cargo-deny 0.20 rejects them there with
# `error[unexpected-keys]: found 3 unexpected keys, expected:
# ["wrappers","deny-multiple-versions","reason","use-instead"]` and then fails
# to deserialize the whole config (#72 moved them down by mistake).
multiple-versions = "warn"
skip = [
    { name = "base64", version = "0.21" },
    { name = "rand", version = "0.7" },
    { name = "rand", version = "0.8" },
    { name = "toml", version = "0.8" },
    { name = "thiserror", version = "1" },
    { name = "zip", version = "0.6" },
    { name = "dirs", version = "5" },
    { name = "which", version = "7" },
]
skip-tree = [
    { name = "chromiumoxide", version = "0.9" },
    { name = "wasmtime", version = "43" },
]

# TLS policy: rustls with the pure-Rust ring provider only. aws-lc-sys needs
# NASM (and a C toolchain) installed to build at all — a build-host burden the
# family removed by pinning every TLS path to ring. Keep it out permanently.
[[bans.deny]]
name = "aws-lc-sys"
