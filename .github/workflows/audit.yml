name: Security Audit

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/browser-glue/package.json'

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit

      - name: Run audit
        run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny

      - name: Run deny check
        run: cargo deny check

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/browser-glue

      - name: Run npm audit
        run: npm audit --omit=dev
        working-directory: packages/browser-glue
