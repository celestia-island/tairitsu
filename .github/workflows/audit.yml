name: Security Audit

# One in-flight run per ref: a superseded push cancels its
# predecessor instead of queueing behind it (farm-pressure
# relief, AGENTS ci-ops 8.3.3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'package.json'
      - 'packages/browser-glue/package.json'

jobs:
  audit:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Cargo Audit
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Remove e2e/website from workspace and local patches
        run: |
          sed -i '/"packages\/e2e",/d; s/,"packages\/e2e"//g' Cargo.toml
          sed -i '/"examples\/website",/d; s/,"examples\/website"//g' Cargo.toml
          sed -i '/path = "\.\.\/hikari/d' Cargo.toml
          rm -f .cargo/config.toml Cargo.lock

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        # Self-hosted runners persist between jobs, so a plain `cargo install`
        # fails with "binary `cargo-audit` already exists in destination" on
        # every run after the first (known-live-issues H9). Reinstall only when
        # the installed version is not the pinned one: `--force` alone would
        # rebuild every run, and a bare `command -v` would silently keep an
        # unknown older binary that judges the tree differently per machine.
        run: |
          cargo audit --version 2>/dev/null | grep -q ' 0\.22\.2' \
            || cargo install cargo-audit --version 0.22.2 --locked --force

      - name: Run audit
        run: cargo audit

  deny:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Cargo Deny
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - name: Remove e2e/website from workspace and local patches
        run: |
          sed -i '/"packages\/e2e",/d; s/,"packages\/e2e"//g' Cargo.toml
          sed -i '/"examples\/website",/d; s/,"examples\/website"//g' Cargo.toml
          sed -i '/path = "\.\.\/hikari/d' Cargo.toml
          rm -f .cargo/config.toml Cargo.lock

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        # Same version-pinned guard as cargo-audit above: an unknown older
        # cargo-deny on a warm runner would otherwise be reused forever.
        run: |
          cargo deny --version 2>/dev/null | grep -q ' 0\.20\.2' \
            || cargo install cargo-deny --version 0.20.2 --locked --force

      - name: Run deny check
        run: cargo deny check

  npm-audit:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: NPM Audit
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --omit=dev
        working-directory: .

      - name: Run npm audit
        run: npm audit --omit=dev
        working-directory: .
