name: WIT Sync with W3C

on:
  schedule:
    # 每周日 UTC 00:00 运行
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-fetch all WebIDL specs'
        required: false
        type: boolean
        default: false
      create_pr:
        description: 'Create PR for changes'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync W3C WebIDL and Generate WIT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache WIT build
        uses: actions/cache@v4
        with:
          path: target/tairitsu-wit
          key: wit-${{ hashFiles('scripts/fetch_webidl.py', 'scripts/gen_wit_from_webidl.py') }}
          restore-keys: |
            wit-

      - name: Fetch W3C WebIDL
        run: |
          # Scheduled runs must revalidate: cached files are skipped without
          # --force, so a warm cache would freeze the corpus forever while the
          # job reports "no changes".
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/fetch_webidl.py --force
          else
            python3 scripts/fetch_webidl.py
          fi

      - name: Generate WIT files
        run: |
          python3 scripts/generate_browser_wit.py
          # The generator writes the single source; the publishing copies (web,
          # ssr composed + ssr monolithic) are derived. Skipping this step is how
          # scheduled syncs used to produce born-red PRs with stale copies.
          python3 scripts/sync_wit.py

      - name: Verify the regenerated tree
        run: |
          python3 scripts/sync_wit.py --check
          python3 scripts/check_wit_generator.py --check
          python3 scripts/check_wit_surface.py --check

      - name: Check for changes
        id: check_changes
        run: |
          # Watch the generator's inputs AND every derived copy: a change to the
          # generator script rewrites composed/ + the monolithic world without
          # touching generated/, which is exactly how this workflow used to
          # report "no changes" while the tree had moved.
          # `git diff` cannot see ADDED files and the sync mirrors the source
          # tree, so detect with `status` rather than `diff`.
          WATCHED="packages/browser-worlds/wit/generated/ \
                   packages/browser-worlds/wit/composed/ \
                   packages/browser-worlds/wit/browser-full.wit \
                   packages/browser-worlds/wit/w3c-idl-full.wit \
                   packages/web/wit/composed/ \
                   packages/ssr/wit/composed/ \
                   packages/ssr/wit/browser-full.wit"
          if [ -z "$(git status --porcelain -- $WATCHED)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No WIT changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "WIT changes detected!"
            git status --short -- $WATCHED
          fi

      - name: Create summary
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "# WIT Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Changed Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git status --short -- packages/browser-worlds/wit/ packages/web/wit/composed/ packages/ssr/wit/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.inputs.create_pr != 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          title: 'chore: sync W3C WebIDL and regenerate WIT files'
          body: |
            ## Automated W3C WebIDL Sync

            This PR was automatically generated by the WIT Sync workflow.

            ### Changes
            - Synced with w3c/webref
            - Regenerated WIT files from latest WebIDL specs
            - Regenerated `wit/generated/` and the composed world
            - Synced the publishing copies (web, ssr) from the single source

            ### Verification
            Please review the generated WIT files to ensure correctness before merging.
          branch: wit-sync-auto
          commit-message: 'chore: sync W3C WebIDL and regenerate WIT files'
          labels: |
            automated
            wit-sync
          delete-branch: true
