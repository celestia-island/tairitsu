name: Publish crates

# Release *preflight* for the crates track: it verifies that the tag matches
# [workspace.package] version and that every publishable crate can actually be
# packaged. It no longer publishes anything.
#
# Publishing moved to `npm-release.yml`, which is the single owner: it publishes
# the whole `tairitsu*` family in dependency order, tolerates crates that are
# already up, and re-checks the family before it starts. Two lanes racing on the
# same tag was the problem — on `v0.5.24` this workflow's publish step probed for
# `tairitsu-macros`, did not see it (the other lane uploaded it in between), ran
# `cargo publish`, and lost the race with `400: crate version already uploaded`,
# turning a successful release into a red check. Its `package-check` job is kept:
# nothing else asks whether a crate can be packaged at all.
#
# Trigger by pushing a `v*` tag (the tag must match [workspace.package] version)
# or via workflow_dispatch.
on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to check (must equal [workspace.package] version, e.g. 0.5.24)"
        required: true
        type: string
      crates:
        description: "Space-separated subset to check and package (default: the full dependency-ordered list)"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CRATES: ${{ inputs.crates || 'tairitsu-macros tairitsu' }}

jobs:
  # ── Refuse to publish anything but the version the tag (or input) names ──
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the requested version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare with [workspace.package] version
        run: |
          WANT="${{ steps.version.outputs.version }}"
          HAVE=$(grep -oP '^\s*version\s*=\s*"\K[^"]+' Cargo.toml | head -1)
          if [ "$HAVE" != "$WANT" ]; then
            echo "::error::[workspace.package] version ($HAVE) != requested version ($WANT)"
            exit 1
          fi
          echo "Publishing version $HAVE for: $CRATES"

  # ── Package check: what exactly will be uploaded ────────────────────────-
  package-check:
    name: Package check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify-version
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: List and package every crate without verification
        run: |
          for crate in $CRATES; do
            cargo package -p "$crate" --list
            cargo package -p "$crate" --no-verify
          done

  # ── Publishing lives in `npm-release.yml` ───────────────────────────────
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify-version, package-check]
    steps:
      - name: Point at the single crates publisher
        env:
          CRATE_VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          echo "::notice::Publishing moved to the \`Publish\` workflow (npm-release.yml)."
          echo "it publishes the whole tairitsu* family at ${CRATE_VERSION} in dependency order,"
          echo "skips what is already on crates.io, and can be rerun safely. This job only"
          echo "guards the tag/version match and that every crate can be packaged."
