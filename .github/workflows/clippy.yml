name: Clippy

# One in-flight run per ref: a superseded push cancels its
# predecessor instead of queueing behind it (farm-pressure
# relief, AGENTS ci-ops 8.3.3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/clippy.yml'
      - 'packages/**/*'
      - 'examples/**/*'
      - 'Cargo.toml'
  push:
    branches: [master]

jobs:
  clippy:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Clippy
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - nightly

    steps:
      - uses: actions/checkout@v7

      - name: Remove e2e/website from workspace and local patches
        run: |
          sed -i '/"packages\/e2e",/d; s/,"packages\/e2e"//g' Cargo.toml
          sed -i '/"examples\/website",/d; s/,"examples\/website"//g' Cargo.toml
          sed -i '/path = "\.\.\/hikari/d' Cargo.toml
          rm -f .cargo/config.toml Cargo.lock

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run clippy
        run: |
          cargo clippy \
            --all-targets \
            --all-features \
            -- -D warnings
