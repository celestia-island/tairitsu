[package]
name = "tairitsu-browser"
version.workspace = true
edition = "2024"
rust-version = "1.85"
authors = ["langyo <langyo.china@gmail.com>"]
license = "MIT"
license-file.workspace = true
description = "Lightweight headless browser automation — CDP engine + HTTP debug API"
repository = "https://github.com/celestia-island/tairitsu"

[lib]
name = "tairitsu_browser"
path = "src/lib.rs"

[features]
# Forwarded to the shared CDP engine in tairitsu-debug-core.
debug-browser = ["tairitsu-debug-core/debug-browser"]

[dependencies]

anyhow = "^1"
tairitsu-debug-core = { version = "^0.5.14", path = "../debug-core" }
tracing = "^0.1"
