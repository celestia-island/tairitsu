[package]
name = "tairitsu-browser-wit-resolver"
version.workspace = true
edition.workspace = true
description = "WIT package version resolution, cloud fetch, and local cache for Tairitsu browser worlds"
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tairitsu-browser-worlds = { workspace = true, optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, features = [
  "blocking",
], optional = true }
sha2 = "^0.10"
hex = "^0.4"

[features]
default = ["embedded"]
fetch = ["reqwest"]
embedded = ["tairitsu-browser-worlds"]

[dev-dependencies]
tempfile = "^3"
